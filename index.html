<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>1v1 联机对枪</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;
  user-select:none;-webkit-user-select:none;font-family:-apple-system,sans-serif}
canvas{display:block}

/* 准星 */
#ch{position:fixed;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;
  pointer-events:none;z-index:20}
#ch span{position:absolute;background:#3aff6a;box-shadow:0 0 4px #000}
#ch .h{left:50%;width:2px;height:8px;margin-left:-1px}
#ch .h.t{top:0}#ch .h.b{bottom:0}
#ch .v{top:50%;height:2px;width:8px;margin-top:-1px}
#ch .v.l{left:0}#ch .v.r{right:0}

#hit{position:fixed;left:50%;top:50%;width:34px;height:34px;margin:-17px 0 0 -17px;
  pointer-events:none;z-index:21;opacity:0;transition:opacity .08s}
#hit.on{opacity:1}
#hit::before,#hit::after{content:'';position:absolute;left:50%;top:50%;
  width:18px;height:2px;background:#fff;box-shadow:0 0 8px #f22}
#hit::before{transform:translate(-50%,-50%) rotate(45deg)}
#hit::after{transform:translate(-50%,-50%) rotate(-45deg)}

/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:15;color:#fff;
  text-shadow:0 2px 6px #000;font-size:14px}
#hp{position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top));width:150px}
#hpBar{height:8px;background:#333;border-radius:4px;overflow:hidden;border:1px solid #666}
#hpFill{height:100%;background:#3aff6a;width:100%;transition:width .15s}
#ehp{position:absolute;right:16px;top:calc(16px + env(safe-area-inset-top));width:150px;text-align:right}
#ehpBar{height:6px;background:#333;border-radius:4px;overflow:hidden;border:1px solid #666;margin-top:4px}
#ehpFill{height:100%;background:#ff5252;width:100%;transition:width .15s}
#ammo{position:absolute;right:20px;bottom:calc(130px + env(safe-area-inset-bottom));
  font-size:22px;font-weight:700}
#ammo b{color:#ffd166;font-size:28px}
#status{position:absolute;left:50%;top:calc(46px + env(safe-area-inset-top));
  transform:translateX(-50%);font-size:11px;letter-spacing:2px;color:#6ee7ff;
  background:rgba(0,0,0,.5);padding:4px 12px;border-radius:99px}

/* 摇杆 */
#joy{position:fixed;width:130px;height:130px;border-radius:50%;
  border:2px solid rgba(255,255,255,.25);
  transform:translate(-50%,-50%);pointer-events:none;opacity:0;
  transition:opacity .15s;z-index:30;
  background:radial-gradient(circle,rgba(255,255,255,.08),transparent)}
#joy.on{opacity:1}
#joyK{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;
  background:radial-gradient(circle,rgba(110,231,255,.9),rgba(70,180,255,.6));
  box-shadow:0 0 16px rgba(110,231,255,.8);transform:translate(-50%,-50%)}

/* 按钮 */
.btn{position:fixed;border-radius:50%;z-index:40;display:flex;
  align-items:center;justify-content:center;font-weight:700;color:#fff;
  font-size:14px;border:2px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.12);touch-action:none;transition:transform .08s}
.btn.on{transform:scale(.9)}
#fire{right:20px;bottom:calc(24px + env(safe-area-inset-bottom));
  width:88px;height:88px;font-size:16px;
  background:radial-gradient(circle,rgba(255,80,80,.5),rgba(200,30,30,.2))}
#fire.on{background:radial-gradient(circle,rgba(255,90,90,.85),rgba(220,40,40,.5))}
#jump{right:118px;bottom:calc(28px + env(safe-area-inset-bottom));width:66px;height:66px}
#reload{right:26px;bottom:calc(126px + env(safe-area-inset-bottom));width:60px;height:60px;font-size:12px}

/* 界面 */
.screen{position:fixed;inset:0;z-index:120;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;gap:14px;
  background:radial-gradient(circle at 50% 40%,#141c2c,#05070c);color:#e8eef7}
.screen.hide{display:none}
.screen h2{font-size:28px;letter-spacing:4px;color:#6ee7ff}
.tip{font-size:13px;color:#9fb0c6;line-height:1.9;text-align:left;max-width:320px}
.tip b{color:#6ee7ff}
.btn2{font-size:15px;letter-spacing:4px;font-weight:700;padding:14px 40px;
  border-radius:99px;border:none;color:#04121a;cursor:pointer;min-width:220px;
  background:linear-gradient(135deg,#6ee7ff,#4cc9f0)}
.btn2.alt{background:linear-gradient(135deg,#a78bfa,#8b5cf6);color:#fff}
.btn2:active{transform:scale(.96)}
.code{font-size:40px;letter-spacing:10px;color:#6ee7ff;font-weight:900;
  padding:14px 28px;border:2px dashed #6ee7ff;border-radius:14px;margin:10px 0}
#joinI{font-size:22px;letter-spacing:6px;text-align:center;font-weight:800;
  padding:12px 20px;border-radius:10px;border:2px solid #6ee7ff;
  background:rgba(0,0,0,.4);color:#6ee7ff;outline:none;text-transform:uppercase}
#st{font-size:13px;color:#9fb0c6;letter-spacing:1px}
#st.err{color:#f66}#st.ok{color:#3aff6a}
#over h2{color:#ff5a5a;font-size:36px}
#over .big{font-size:80px}
</style>
</head>
<body>
<div id="ch"><span class="h t"></span><span class="h b"></span>
  <span class="v l"></span><span class="v r"></span></div>
<div id="hit"></div>

<div id="hud">
  <div id="hp">
    <div id="hpBar"><div id="hpFill"></div></div>
    <div style="font-size:12px;margin-top:4px">HP <span id="hpN">100</span></div>
  </div>
  <div id="ehp">
    <div style="font-size:12px">敌人 HP <span id="ehpN">100</span></div>
    <div id="ehpBar"><div id="ehpFill"></div></div>
  </div>
  <div id="ammo"><b id="ammoN">40</b> / 40</div>
  <div id="status">已连接</div>
</div>

<div id="joy"><div id="joyK"></div></div>
<div class="btn" id="fire">开火</div>
<div class="btn" id="jump">跳</div>
<div class="btn" id="reload">换弹</div>

<div class="screen" id="menu">
  <h2>1v1 对 枪</h2>
  <div class="tip">
    <b>创建房间</b> — 生成房间号给朋友<br>
    <b>加入房间</b> — 输入朋友发来的房间号<br>
    <b>手机</b>：左半屏拖摇杆移动 · 右半屏拖转视角<br>
    <b>电脑</b>：WASD 移动 · 鼠标转视角 · 空格跳 · R 换弹<br>
    子弹 40 · 身体伤害 10 · 爆头伤害 15
  </div>
  <button class="btn2" id="bCreate">创 建 房 间</button>
  <button class="btn2 alt" id="bJoin">加 入 房 间</button>
</div>

<div class="screen hide" id="wait">
  <h2>房 间 已 创 建</h2>
  <div style="font-size:12px;color:#9fb0c6">把房间号发给你的朋友</div>
  <div class="code" id="code">------</div>
  <button class="btn2" id="bCopy">复 制 房 间 号</button>
  <div id="st">等待对方加入...</div>
  <button class="btn2 alt" id="bCancel1" style="font-size:12px;padding:10px 30px;min-width:auto">取 消</button>
</div>

<div class="screen hide" id="joinS">
  <h2>加 入 房 间</h2>
  <input id="joinI" maxlength="6" placeholder="ABC123">
  <button class="btn2" id="bJoinGo">连 接</button>
  <div id="st2" style="font-size:13px;color:#9fb0c6"></div>
  <button class="btn2 alt" id="bCancel2" style="font-size:12px;padding:10px 30px;min-width:auto">返 回</button>
</div>

<div class="screen hide" id="over">
  <h2 id="overT">VICTORY</h2>
  <div class="big" id="overB">🏆</div>
  <button class="btn2" id="bAgain" style="margin-top:20px">重 新 开 始</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>
/* ========== 全局 ========== */
let scene,camera,renderer,clock;
let state='menu';
let peer=null,conn=null,isHost=false,roomCode='';

const P = {pos:new THREE.Vector3(0,0,-15),yaw:Math.PI,pitch:0,
  vx:0,vz:0,vy:0,hp:100,onGround:true,eye:1.65,
  bob:0,recoil:0,ammo:40,reloading:false,reloadT:0,lastShot:0};

const R = {group:null,pos:new THREE.Vector3(0,0,15),yaw:0,hp:100,loaded:false};

const walls=[],tracers=[],impacts=[];
let gun,muzzle,killFlag=false;

const K={};
let joyId=null,joyX=0,joyY=0,joyOX=0,joyOY=0;
let lookId=null,lPX=0,lPY=0;
let fireHeld=false;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
function init(){
  clock=new THREE.Clock();
  scene=new THREE.Scene();
  scene.background=new THREE.Color(0x87b9e0);
  scene.fog=new THREE.Fog(0x87b9e0,50,180);

  camera=new THREE.PerspectiveCamera(80,innerWidth/innerHeight,0.05,400);
  camera.rotation.order='YXZ';
  scene.add(camera);

  renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.shadowMap.enabled=true;
  document.body.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xcfe4ff,0x4a5a3a,0.95));
  const sun=new THREE.DirectionalLight(0xfff4e0,1.05);
  sun.position.set(30,60,20);sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  const sc=sun.shadow.camera;sc.left=-40;sc.right=40;sc.top=40;sc.bottom=-40;
  scene.add(sun);

  // 地面
  const ground=new THREE.Mesh(
    new THREE.PlaneGeometry(200,200),
    new THREE.MeshStandardMaterial({color:0x6b8a4a,roughness:0.95}));
  ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

  // 围墙
  const wm=new THREE.MeshStandardMaterial({color:0x9ba5b0,roughness:0.9});
  const S=35,WH=6,TH=1;
  [[0,-S,S*2,TH],[0,S,S*2,TH],[-S,0,TH,S*2],[S,0,TH,S*2]].forEach(w=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w[2],WH,w[3]),wm);
    m.position.set(w[0],WH/2,w[1]);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    walls.push({minX:w[0]-w[2]/2,maxX:w[0]+w[2]/2,minZ:w[1]-w[3]/2,maxZ:w[1]+w[3]/2});
  });

  // 掩体
  const cm=new THREE.MeshStandardMaterial({color:0x8a7550,roughness:0.85});
  [[8,8,2.5],[-8,-8,2.5],[8,-8,2.5],[-8,8,2.5],
   [0,0,3.0],[14,0,2.0],[-14,0,2.0],[0,14,2.0],[0,-14,2.0]].forEach(c=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(c[2],2.4,c[2]),cm);
    m.position.set(c[0],1.2,c[1]);m.castShadow=true;m.receiveShadow=true;scene.add(m);
    walls.push({minX:c[0]-c[2]/2,maxX:c[0]+c[2]/2,minZ:c[1]-c[2]/2,maxZ:c[1]+c[2]/2});
  });

  buildGun();
  buildRemote();
  bind();

  animate();
}

/* ========== 枪 ========== */
function buildGun(){
  gun=new THREE.Group();
  camera.add(gun);

  const dark=new THREE.MeshStandardMaterial({color:0x22252b,roughness:0.55,metalness:0.7,depthTest:false});
  const darker=new THREE.MeshStandardMaterial({color:0x14161a,roughness:0.5,metalness:0.75,depthTest:false});
  const brown=new THREE.MeshStandardMaterial({color:0x4a3524,roughness:0.85,depthTest:false});
  const steel=new THREE.MeshStandardMaterial({color:0x9aa2ad,roughness:0.25,metalness:0.95,depthTest:false});

  const body=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.13,0.5),dark);
  body.position.set(0,0,-0.2);gun.add(body);
  const barrel=new THREE.Mesh(new THREE.CylinderGeometry(0.02,0.02,0.5,10),steel);
  barrel.rotation.x=Math.PI/2;barrel.position.set(0,0.015,-0.65);gun.add(barrel);
  const mag=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.24,0.12),darker);
  mag.position.set(0,-0.18,-0.28);gun.add(mag);
  const grip=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,0.1),brown);
  grip.position.set(0,-0.15,-0.04);grip.rotation.x=0.28;gun.add(grip);
  const stock=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.11,0.26),dark);
  stock.position.set(0,-0.03,0.1);gun.add(stock);

  muzzle=new THREE.Mesh(new THREE.SphereGeometry(0.08,6,6),
    new THREE.MeshBasicMaterial({color:0xffe066,transparent:true,opacity:1,depthTest:false}));
  muzzle.position.set(0,0.015,-0.92);muzzle.visible=false;gun.add(muzzle);
  muzzle.userData={t:0};

  gun.position.set(0.24,-0.22,-0.4);
  gun.traverse(o=>{if(o.isMesh)o.renderOrder=999;});
}
function buildRemote(){
  const g=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:0xd9a882});
  const body=new THREE.MeshStandardMaterial({color:0xa83a3a});
  const leg=new THREE.MeshStandardMaterial({color:0x4a1a1a});

  const torso=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.7,0.3),body);
  torso.position.y=1.15;torso.userData.part='body';g.add(torso);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.16,12,10),skin);
  head.position.y=1.68;head.userData.part='head';g.add(head);
  const armL=new THREE.Mesh(new THREE.BoxGeometry(0.13,0.6,0.13),body);
  armL.position.set(-0.31,1.35,0);armL.userData.part='body';g.add(armL);
  const armR=armL.clone();armR.position.x=0.31;g.add(armR);
  const legL=new THREE.Mesh(new THREE.BoxGeometry(0.17,0.75,0.17),leg);
  legL.position.set(-0.14,0.38,0);legL.userData.part='body';g.add(legL);
  const legR=legL.clone();legR.position.x=0.14;g.add(legR);

  g.position.copy(R.pos);
  g.visible=false;
  scene.add(g);
  R.group=g;
}

/* ========== 网络 ========== */
function genCode(){
  const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';
  for(let i=0;i<6;i++)s+=c[Math.floor(Math.random()*c.length)];return s;
}

function createRoom(){
  isHost=true;roomCode=genCode();
  document.getElementById('code').textContent=roomCode;
  document.getElementById('menu').classList.add('hide');
  document.getElementById('wait').classList.remove('hide');
  const st=document.getElementById('st');st.textContent='连接服务器中...';st.className='';

  try{peer=new Peer(roomCode,{debug:1});}
  catch(e){st.textContent='创建失败：'+e.message;st.className='err';return;}

  peer.on('open',()=>{st.textContent='等待对方加入...';st.className='ok';});
  peer.on('connection',c=>{if(conn){c.close();return;}conn=c;setupConn();});
  peer.on('error',e=>{st.textContent='错误：'+(e.type||e.message);st.className='err';});
}

function joinRoom(code){
  isHost=false;roomCode=code;
  document.getElementById('menu').classList.add('hide');
  document.getElementById('joinS').classList.remove('hide');
  const st=document.getElementById('st2');st.textContent='连接中...';st.style.color='#6ee7ff';

  try{peer=new Peer(null,{debug:1});}
  catch(e){st.textContent='失败：'+e.message;st.style.color='#f66';return;}

  peer.on('open',()=>{conn=peer.connect(code,{reliable:false});setupConn();});
  peer.on('error',e=>{
    st.textContent='连接失败：'+(e.type==='peer-unavailable'?'房间不存在':e.type);
    st.style.color='#f66';
  });
}

function setupConn(){
  const enter=()=>{
    document.getElementById('wait').classList.add('hide');
    document.getElementById('joinS').classList.add('hide');
    startGame();
  };
  conn.on('open',enter);
  conn.on('data',handleData);
  conn.on('close',()=>{
    document.getElementById('status').textContent='对方已离开';
    if(state==='playing')endGame(true);
  });
  if(conn.open)enter();
}

function handleData(d){
  if(!d||!d.t)return;
  if(d.t==='s'){
    R.pos.set(d.x,d.y,d.z);R.yaw=d.yaw;R.loaded=true;
  } else if(d.t==='shoot'){
    playShot();
    if(R.group){
      const m=new THREE.Mesh(new THREE.SphereGeometry(0.15,6,6),
        new THREE.MeshBasicMaterial({color:0xffcc44,transparent:true,opacity:.9,depthWrite:false}));
      m.position.copy(R.group.position);m.position.y=1.35;
      scene.add(m);impacts.push({mesh:m,life:0.05,maxLife:0.05});
    }
  } else if(d.t==='hit'){
    P.hp=Math.max(0,P.hp-d.d);updateHP();
    document.getElementById('dmgFlash')||(()=>{});
    if(P.hp<=0){conn.send({t:'dead'});endGame(false);}
  } else if(d.t==='dead'){
    endGame(true);
  } else if(d.t==='restart'){
    resetGame();
    state='playing';
    document.getElementById('over').classList.add('hide');
  }
}

function sendState(){
  if(!conn||!conn.open)return;
  conn.send({t:'s',x:P.pos.x,y:P.pos.y,z:P.pos.z,yaw:P.yaw});
}
function resetGame(){
  const z=isHost?-15:15;
  P.pos.set(0,0,z);P.yaw=isHost?Math.PI:0;P.pitch=0;
  P.vx=0;P.vz=0;P.vy=0;P.hp=100;P.ammo=40;P.reloading=false;P.recoil=0;
  R.pos.set(0,0,isHost?15:-15);R.yaw=isHost?0:Math.PI;R.hp=100;
  if(R.group){R.group.position.copy(R.pos);R.group.rotation.y=R.yaw;R.group.visible=true;}
  updateHP();updateEHp();updateAmmo();
  camera.position.set(P.pos.x,P.eye,P.pos.z);
  camera.rotation.set(0,P.yaw,0,'YXZ');
}

function startGame(){
  initAudio();
  state='playing';
  document.getElementById('over').classList.add('hide');
  document.getElementById('status').textContent='已连接';
  resetGame();
}

function endGame(win){
  if(state==='over')return;
  state='over';
  document.getElementById('overT').textContent=win?'VICTORY':'YOU DIED';
  document.getElementById('overB').textContent=win?'🏆':'☠';
  document.getElementById('over').classList.remove('hide');
}

/* ========== 音频 ========== */
let actx=null;
function initAudio(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}
  if(actx&&actx.state==='suspended')actx.resume();
}
function playShot(){
  if(!actx)return;
  const t=actx.currentTime;
  const len=Math.floor(actx.sampleRate*0.12);
  const buf=actx.createBuffer(1,len,actx.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const s=actx.createBufferSource();s.buffer=buf;
  const f=actx.createBiquadFilter();f.type='lowpass';f.frequency.value=2000;
  const g=actx.createGain();g.gain.setValueAtTime(0.2,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+0.15);
  s.connect(f);f.connect(g);g.connect(actx.destination);
  s.start(t);s.stop(t+0.14);
}

/* ========== 玩家更新 ========== */
function updatePlayer(dt){
  let ix=0,iz=0;
  if(K['keyw'])iz+=1;if(K['keys'])iz-=1;
  if(K['keya'])ix-=1;if(K['keyd'])ix+=1;
  if(joyId!==null){const m=Math.hypot(joyX,joyY);if(m>0.16){ix=joyX;iz=-joyY;}}
  const has=Math.hypot(ix,iz)>0.05;
  const speed=10;
  let vx=0,vz=0;
  if(has){
    const len=Math.hypot(ix,iz),nx=ix/len,nz=iz/len;
    const fx=-Math.sin(P.yaw),fz=-Math.cos(P.yaw);
    const rx=Math.cos(P.yaw),rz=-Math.sin(P.yaw);
    vx=(fx*nz+rx*nx)*speed;vz=(fz*nz+rz*nx)*speed;
  }
  const k=Math.min(1,18*dt);
  P.vx+=(vx-P.vx)*k;P.vz+=(vz-P.vz)*k;

  // 重力/跳跃
  P.vy+=-25*dt;
  P.pos.y+=P.vy*dt;
  if(P.pos.y<=0){P.pos.y=0;P.vy=0;P.onGround=true;}
  if((K['space'])&&P.onGround){P.vy=8;P.onGround=false;}

  let nx=P.pos.x+P.vx*dt,nz=P.pos.z+P.vz*dt;
  const res=collide(nx,nz,0.4);
  P.pos.x=clamp(res[0],-33,33);P.pos.z=clamp(res[1],-33,33);

  P.bob+=dt*(2.6+Math.hypot(P.vx,P.vz)*1.4);
  const by=Math.abs(Math.sin(P.bob))*0.03*Math.min(1,Math.hypot(P.vx,P.vz)/10);
  camera.position.set(P.pos.x,P.eye+P.pos.y+by,P.pos.z);
  camera.rotation.set(P.pitch,P.yaw,0,'YXZ');
}

function collide(px,pz,r){
  for(const c of walls){
    const cx=clamp(px,c.minX,c.maxX),cz=clamp(pz,c.minZ,c.maxZ);
    const dx=px-cx,dz=pz-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2>1e-8){const d=Math.sqrt(d2);px=cx+dx/d*r;pz=cz+dz/d*r;}
      else{
        const tL=px-c.minX,tR=c.maxX-px,tT=pz-c.minZ,tB=c.maxZ-pz;
        const m=Math.min(tL,tR,tT,tB);
        if(m===tL)px=c.minX-r;else if(m===tR)px=c.maxX+r;
        else if(m===tT)pz=c.minZ-r;else pz=c.maxZ+r;
      }
    }
  }
  return[px,pz];
}
function updateRemote(dt){
  if(!R.group)return;
  if(!R.loaded){R.group.visible=false;return;}
  R.group.visible=true;
  R.group.position.lerp(R.pos,Math.min(1,14*dt));
  let dy=R.yaw-R.group.rotation.y;
  while(dy>Math.PI)dy-=Math.PI*2;while(dy<-Math.PI)dy+=Math.PI*2;
  R.group.rotation.y+=dy*Math.min(1,14*dt);
}

/* ========== 射击 ========== */
function shoot(){
  if(P.reloading)return;
  if(state!=='playing')return;
  if(!R.loaded)return;
  const now=performance.now()/1000;
  if(now-P.lastShot<0.1)return;
  if(P.ammo<=0){startReload();return;}
  P.lastShot=now;P.ammo--;
  P.recoil=Math.min(1.2,P.recoil+1);
  muzzle.userData.t=0.05;
  playShot();updateAmmo();
  if(conn&&conn.open)conn.send({t:'shoot'});

  camera.updateMatrixWorld(true);
  const o=camera.position.clone();
  const dir=new THREE.Vector3(0,0,-1).applyQuaternion(camera.quaternion);
  dir.x+=rnd(-0.01,0.01);dir.y+=rnd(-0.01,0.01);dir.z+=rnd(-0.01,0.01);
  dir.normalize();

  const ray=new THREE.Raycaster(o,dir,0.1,200);
  const hits=ray.intersectObjects([R.group],true);
  const end=o.clone().addScaledVector(dir,200);

  if(hits.length>0){
    const h=hits[0];
    const part=h.object.userData.part||'body';
    const dmg=part==='head'?15:10;
    if(conn&&conn.open)conn.send({t:'hit',d:dmg});
    spawnHit(h.point);
    spawnTracer(o.clone().add(new THREE.Vector3(0,-0.1,-0.3)),h.point);
    showHit();
  } else {
    spawnTracer(o.clone().add(new THREE.Vector3(0,-0.1,-0.3)),end);
  }
}

function startReload(){
  if(P.reloading||P.ammo>=40)return;
  P.reloading=true;P.reloadT=2;
}

/* ========== 特效 ========== */
function spawnTracer(a,b){
  const g=new THREE.BufferGeometry().setFromPoints([a.clone(),b.clone()]);
  const m=new THREE.LineBasicMaterial({color:0xfff0a0,transparent:true,opacity:0.9,depthWrite:false});
  const l=new THREE.Line(g,m);scene.add(l);
  tracers.push({mesh:l,life:0.06,maxLife:0.06});
}
function spawnHit(p){
  const m=new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),
    new THREE.MeshBasicMaterial({color:0xff3333,transparent:true,opacity:1,depthWrite:false}));
  m.position.copy(p);scene.add(m);
  impacts.push({mesh:m,life:0.25,maxLife:0.25});
}
function updateFx(dt){
  for(let i=tracers.length-1;i>=0;i--){
    const t=tracers[i];t.life-=dt;
    t.mesh.material.opacity=clamp(t.life/t.maxLife,0,1)*0.9;
    if(t.life<=0){scene.remove(t.mesh);t.mesh.geometry.dispose();
      t.mesh.material.dispose();tracers.splice(i,1);}
  }
  for(let i=impacts.length-1;i>=0;i--){
    const e=impacts[i];e.life-=dt;
    const k=clamp(e.life/e.maxLife,0,1);
    e.mesh.scale.setScalar(1+(1-k)*3);e.mesh.material.opacity=k;
    if(e.life<=0){scene.remove(e.mesh);e.mesh.geometry.dispose();
      e.mesh.material.dispose();impacts.splice(i,1);}
  }
}
let hitT=0;
function showHit(){
  document.getElementById('hit').classList.add('on');
  hitT=0.14;
}
function updateHP(){
  document.getElementById('hpFill').style.width=clamp(P.hp,0,100)+'%';
  document.getElementById('hpN').textContent=Math.round(P.hp);
}
function updateEHp(){
  document.getElementById('ehpFill').style.width=clamp(R.hp,0,100)+'%';
  document.getElementById('ehpN').textContent=Math.round(R.hp);
}
function updateAmmo(){
  document.getElementById('ammoN').textContent=P.ammo;
}

/* ========== 事件 ========== */
function bind(){
  const cv=renderer.domElement;

  window.addEventListener('keydown',e=>{
    K[e.code.toLowerCase()]=true;
    if(e.code==='Space')e.preventDefault();
    if(e.code==='KeyR')startReload();
  });
  window.addEventListener('keyup',e=>{K[e.code.toLowerCase()]=false;});

  document.addEventListener('mousedown',e=>{
    if(state!=='playing')return;
    if(e.button===0&&!('ontouchstart'in window))fireHeld=true;
  });
  document.addEventListener('mouseup',e=>{if(e.button===0)fireHeld=false;});
  document.addEventListener('mousemove',e=>{
    if(document.pointerLockElement!==cv)return;
    P.yaw-=e.movementX*0.0022;P.pitch-=e.movementY*0.0022;
    P.pitch=clamp(P.pitch,-Math.PI/2+0.03,Math.PI/2-0.03);
  });
  cv.addEventListener('click',()=>{
    if(state==='playing'&&!('ontouchstart'in window)&&document.pointerLockElement!==cv)
      cv.requestPointerLock();
  });

  document.addEventListener('touchstart',e=>{
    if(state!=='playing')return;
    let c=false;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      const el=document.elementFromPoint(t.clientX,t.clientY);
      if(el&&el.closest('.btn'))continue;
      if(t.clientX<innerWidth*0.5&&joyId===null){
        joyId=t.identifier;joyOX=t.clientX;joyOY=t.clientY;joyX=0;joyY=0;
        const j=document.getElementById('joy');
        j.style.left=joyOX+'px';j.style.top=joyOY+'px';j.classList.add('on');
        document.getElementById('joyK').style.transform='translate(-50%,-50%)';
        c=true;
      } else if(lookId===null){
        lookId=t.identifier;lPX=t.clientX;lPY=t.clientY;c=true;
      }
    }
    if(c)e.preventDefault();
  },{passive:false});

  document.addEventListener('touchmove',e=>{
    if(state!=='playing')return;
    let c=false;
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===joyId){
        let dx=t.clientX-joyOX,dy=t.clientY-joyOY;
        const len=Math.hypot(dx,dy);
        if(len>60){dx=dx/len*60;dy=dy/len*60;}
        document.getElementById('joyK').style.transform=
          `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
        joyX=dx/60;joyY=dy/60;c=true;
      } else if(t.identifier===lookId){
        const dx=t.clientX-lPX,dy=t.clientY-lPY;
        lPX=t.clientX;lPY=t.clientY;
        P.yaw-=dx*0.0055;P.pitch-=dy*0.0055;
        P.pitch=clamp(P.pitch,-Math.PI/2+0.03,Math.PI/2-0.03);c=true;
      }
    }
    if(c)e.preventDefault();
  },{passive:false});

  const endT=e=>{
    for(let i=0;i<e.changedTouches.length;i++){
      const t=e.changedTouches[i];
      if(t.identifier===joyId){joyId=null;joyX=0;joyY=0;
        document.getElementById('joy').classList.remove('on');}
      if(t.identifier===lookId)lookId=null;
    }
  };
  document.addEventListener('touchend',endT,{passive:true});
  document.addEventListener('touchcancel',endT,{passive:true});
  holdBtn('fire',()=>fireHeld=true,()=>fireHeld=false);
  holdBtn('jump',()=>{if(P.onGround&&state==='playing'){P.vy=8;P.onGround=false;}},()=>{});
  tapBtn('reload',()=>startReload());

  // 菜单
  document.getElementById('bCreate').onclick=createRoom;
  document.getElementById('bJoin').onclick=()=>{
    document.getElementById('menu').classList.add('hide');
    document.getElementById('joinS').classList.remove('hide');
    setTimeout(()=>document.getElementById('joinI').focus(),100);
  };
  document.getElementById('bCancel1').onclick=()=>{
    if(peer){try{peer.destroy()}catch(e){}peer=null;}conn=null;
    document.getElementById('wait').classList.add('hide');
    document.getElementById('menu').classList.remove('hide');
  };
  document.getElementById('bCancel2').onclick=()=>{
    if(peer){try{peer.destroy()}catch(e){}peer=null;}conn=null;
    document.getElementById('joinS').classList.add('hide');
    document.getElementById('menu').classList.remove('hide');
  };
  document.getElementById('bCopy').onclick=()=>{
    const c=document.getElementById('code').textContent;
    const done=()=>{const b=document.getElementById('bCopy');
      b.textContent='已复制 ✓';setTimeout(()=>b.textContent='复 制 房 间 号',1500);};
    if(navigator.clipboard)navigator.clipboard.writeText(c).then(done).catch(()=>fallbackCopy(c,done));
    else fallbackCopy(c,done);
  };
  const ji=document.getElementById('joinI');
  ji.addEventListener('input',()=>{ji.value=ji.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);});
  ji.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('bJoinGo').click();});
  document.getElementById('bJoinGo').onclick=()=>{
    const c=ji.value.trim();
    if(c.length!==6){const s=document.getElementById('st2');
      s.textContent='房间号必须为 6 位';s.style.color='#f66';return;}
    joinRoom(c);
  };
  document.getElementById('bAgain').onclick=()=>{
    if(conn&&conn.open)conn.send({t:'restart'});
    document.getElementById('over').classList.add('hide');
    state='playing';resetGame();
  };

  window.addEventListener('resize',()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  });
  window.addEventListener('orientationchange',()=>setTimeout(()=>{
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
  },200));
}

function fallbackCopy(t,cb){
  const ta=document.createElement('textarea');ta.value=t;
  ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);
  ta.select();try{document.execCommand('copy')}catch(e){}
  document.body.removeChild(ta);cb();
}

function holdBtn(id,onD,onU){
  const el=document.getElementById(id);
  if(!el)return;
  let held=false;
  const d=e=>{e.preventDefault();e.stopPropagation();if(held)return;
    held=true;el.classList.add('on');onD();};
  const u=e=>{e.preventDefault();e.stopPropagation();if(!held)return;
    held=false;el.classList.remove('on');onU();};
  el.addEventListener('touchstart',d,{passive:false});
  el.addEventListener('touchend',u,{passive:false});
  el.addEventListener('touchcancel',u,{passive:false});
  el.addEventListener('mousedown',d);
  el.addEventListener('mouseup',u);
  el.addEventListener('mouseleave',u);
}
function tapBtn(id,fn){
  const el=document.getElementById(id);
  if(!el)return;
  el.addEventListener('touchstart',e=>{e.preventDefault();e.stopPropagation();
    el.classList.add('on');fn();},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();e.stopPropagation();
    el.classList.remove('on');},{passive:false});
  el.addEventListener('click',e=>{e.preventDefault();fn();});
}
let syncT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);

  if(state==='playing'){
    if(fireHeld)shoot();

    if(P.reloading){
      P.reloadT-=dt;
      if(P.reloadT<=0){P.reloading=false;P.ammo=40;updateAmmo();}
    }

    updatePlayer(dt);
    updateRemote(dt);
    updateFx(dt);

    // 枪动画
    P.recoil*=Math.pow(0.0008,dt);
    const spd=Math.hypot(P.vx,P.vz);
    const bx=Math.cos(P.bob)*Math.min(spd/12,1)*0.02;
    const by2=Math.abs(Math.sin(P.bob))*Math.min(spd/12,1)*0.02;
    gun.position.x=0.24+bx;
    gun.position.y=-0.22+by2-P.recoil*0.01;
    gun.position.z=-0.4+P.recoil*0.05;
    gun.rotation.x=P.recoil*0.35;

    if(muzzle.userData.t>0){
      muzzle.userData.t-=dt;muzzle.visible=true;
      muzzle.scale.setScalar(0.8+Math.random()*0.8);
      muzzle.material.opacity=clamp(muzzle.userData.t/0.05,0,1);
    } else muzzle.visible=false;

    if(hitT>0){hitT-=dt;if(hitT<=0)document.getElementById('hit').classList.remove('on');}

    syncT+=dt;
    if(syncT>0.05){syncT=0;sendState();}
  } else if(state==='over'){
    camera.rotation.set(P.pitch,P.yaw,0,'YXZ');
    updateRemote(dt);
  } else {
    const t=performance.now()*0.0003;
    camera.position.set(Math.sin(t)*15,5,Math.cos(t)*15);
    camera.lookAt(0,1,0);
  }

  renderer.render(scene,camera);
}

/* 启动 */
init();
</script>
